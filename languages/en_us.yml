  usage: "&b/town help [chapter] [page] &7- read the in-game handbook\n&b/town create <name> &7- create a town (existing land stays personal; landless founders receive a founding outpost; see the creation quote)\n&b/town invite <player> &7- invite a player (mayor/assistant)\n&b/town join <town> [confirm] &7- join an invited town\n&b/town rename <new name> &7- rename your town (mayor only)\n&b/town leave &7- leave your town (land stays with the town)\n&b/town kick <player> &7- kick a resident (mayor/assistant)\n&b/town transfer <player> &7- transfer the mayor role\n&b/town promote|demote <player> &7- appoint assistant / set member role (mayor only)\n&b/town disband [confirm] &7- disband the town (dissolves outposts)\n&b/town deposit <amount> &7- deposit into the town bank\n&b/town withdraw <amount> &7- withdraw from the town bank (mayor/assistant)\n&b/town outpost create <name> &7- create a remote outpost (selected points)\n&b/town admin <outpost> [player] &7- set/clear the outpost admin\n&b/town upgrade [confirm] &7- one-way upgrade to town permission templates (mayor only)\n&b/town release <outpost> [confirm] &7- mayor returns contributed land (OP arbitration)\n&b/town level [submit] &7- view the shared level task or submit inventory items\n&b/town level set <town> <level> &7- set town level (OP only)\n&b/town trust <player> <town|outpost <name>> <build> <destroy> <switch> <item_use>\n&b/town untrust <player> [town|outpost <name>]\n&b/town info [town] &7- town information\n&b/town list &7- list towns"
