migration-text:
  town-data-dropped: The source server has town data; towns do NOT follow a server merge — imported dominions become townless.
town-create-inputter-text:
  button: CREATE TOWN
  hint: Enter the new town name.
  confirm-hint: Type 'confirm' to create the town without automatically attaching the listed land.
  description: Create a town. Existing personal land stays personal and can be contributed later with /town attach; landless founders receive a starter outpost.
town-outpost-admin-inputter-text:
  button: OUTPOST ADMIN
  hint: Enter the player name to appoint, or 'clear' to remove.
  description: Appoint or clear the outpost admin.
town-outpost-create-inputter-text:
  hint: Enter the new outpost name. The two currently selected points will be used.
town-rename-inputter-text:
  button: RENAME TOWN
  hint: Enter a new town name (spaces are not allowed).
  description: Rename this town (mayor only).
town-disband-confirm-inputter-text:
  button: DISBAND
  hint: Type 'confirm' to disband the town.
