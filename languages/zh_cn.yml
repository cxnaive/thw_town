town-guide-text:
  title: "小镇手册"
  button: "小镇手册"
  page-help: "本页帮助"
  description: "从加入小镇开始，一步步了解建造、权限和属地。"
  read: "点击开始阅读；将鼠标放到纸张上看内容，箭头翻页。"
  back: "返回原页面"
  contents: "手册目录"
  previous-page: "上一节"
  next-page: "下一节"
  next-chapter: "下一章"
  page-info: "第 {0}/{1} 节"
  open-town: "打开小镇首页"
  open-groups: "打开成员权限管理"
  open-outposts: "打开属地列表"
  open-trusts: "打开镇外玩家权限（信任）"
  open-tasks: "打开共同升级任务"
  context: "小镇：{0}"
  no-town: "未加入小镇也可以阅读。初次游玩，建议从第一章开始。"
  example-town: "橡树镇"
  stick: "木棍"
  enabled: "已开启"
  disabled: "已关闭"
  unlimited: "不限"
  unknown-topic: "没有章节 {0}，已打开手册目录。"
  task-line: "{0} 级：{1} × {2}"
  no-tasks: "当前没有可提交的升级任务。"
  dissolve-all: "所有小镇属地都会失去领地保护。建筑和箱内物品不会被删除。"
  return-contributed: "贡献的领地归还贡献者，其他小镇属地失去保护。建筑和箱内物品不会被删除。"
  start:
    title: "开始玩小镇"
    summary: "认识属地，加入朋友的小镇，或自己建镇。"
    sections:
      - "小镇和属地是什么\n小镇是大家一起生活的团队。“属地”是属于小镇的一块领地，可以是住宅区、农场或仓库。\n同一个小镇可以有多块属地，不必连在一起。输入 /town 打开小镇菜单。"
      - "接受朋友的邀请\n先请镇长或副镇长邀请你，再按邀请消息输入加入命令。\n例如：/town join {town}\n互通子服之间也能接受邀请。加入小镇不会自动把你的个人领地交给小镇。"
      - "自己创建小镇\n在主菜单点击“创建小镇”，或输入 /town create <小镇名>。\n如果你还没有领地，会在当前位置创建一块 {founding_size} × {founding_size} × {founding_size} 的建镇属地，费用为 {founding_cost}，从个人钱包支付。已有个人领地不会自动挂靠。"
      - "接下来做什么\n普通成员可以先请镇长安排住处和权限；镇长可以从添加成员、设置权限组开始。\n想扩大活动范围，就阅读“管理小镇属地”。想知道为什么不能建造，就阅读“权限怎么继承”。"
      - "找小镇和领地\n在小镇或领地列表点击“搜索”，输入名字的一部分。例如“黄金”或“黄城”都能找到“黄金城”，英文不区分大小写。\n也可用 /town search <关键词> 找小镇，或 /dom search <关键词> 找自己拥有或可管理的领地。在小镇属地列表搜索时，只找这个小镇的属地。"
  roles:
    title: "谁能做什么"
    summary: "先认识管理身份，再认识成员权限组。"
    sections:
      - "权限是什么\n权限就是“能不能做某件事”。例如放置方块、破坏方块、打开箱子，都有各自的设置。\n允许建造不一定允许开箱子；需要什么操作，就查看对应的权限。"
      - "镇长、副镇长和成员\n镇长和副镇长都能管理成员、权限组及单块属地。普通成员在属地里能做什么，由自己的权限组决定。\n解散整个小镇只允许镇长或服务器管理员操作，副镇长不能解散。"
      - "权限组是什么\n权限组让一批成员共用同一套操作权限。例如把负责建房的玩家放进“建筑组”，统一允许建造。\n没有分配自定义组的成员，使用“小镇成员（默认组）”。加入建筑组不会变成副镇长。"
      - "如何分配成员\n进入“小镇 → 成员权限管理”，创建组后打开它的成员页面，从已有小镇成员中选择玩家。\n创建组示例：builders 建筑组\n前面的 builders 是输入命令时使用的名字，后面的“建筑组”是界面里显示的名字。"
      - "创建者与贡献者\n为小镇直接新建的属地显示“创建者”；个人领地挂靠到小镇后，原主人显示为“贡献者”。\n他们和被任命的属地管理员可以管理这块地的部分设置，但仅凭这些身份不能删除或调整小镇属地大小。"
  templates:
    title: "权限怎么继承"
    summary: "从全镇共用设置，到一块属地的例外。"
    sections:
      - "全镇默认权限是什么\n“全镇默认权限”就是一份全镇共用的权限模板。每个成员组都有自己的模板。\n例如“建筑组”的模板允许放置方块，就可以让这个组在多块属地里建造，不必每块地都设置一遍。"
      - "继承是什么意思\n“继承”就是这块属地跟着小镇模板走。\n模板允许放置方块，这里就允许；模板改成禁止，这里也跟着禁止。\n所以“继承”本身不等于允许，也不等于禁止，要看模板现在怎么设置。"
      - "例子一：大家都能建造\n小明属于“建筑组”，小镇有住宅区和农场两块属地。\n把建筑组模板里的“放置方块”设为允许，两块地都保持继承。\n结果：小明在住宅区和农场都能放置方块。"
      - "例子二：仓库单独禁止\n现在多了一块仓库属地，希望建筑组能在别处建造，但不能改动仓库。\n在仓库的建筑组权限里，将“放置方块”单独设为禁止。\n这叫“覆盖”：只让这一块地、这个组的这一项权限使用自己的设置。"
      - "之后修改模板会怎样\n接着上面的例子：把建筑组模板改为禁止，再改回允许。\n住宅区和农场一直跟着变化；仓库仍然禁止。\n仓库其他保持继承的权限，还是会跟着模板变化。"
      - "如何恢复继承\n如果仓库也可以建造了，把仓库的“放置方块”恢复为继承即可。\n它会立即按模板当前的值决定允许或禁止，以后模板再改，它也会跟着改。"
      - "到哪里设置\n全镇统一设置：小镇 → 成员权限管理 → 小镇成员（默认组），或自定义组 → 全镇默认权限。\n只改一块地：打开该属地的对应组权限。箱子界面左键切换单独允许／禁止，右键恢复继承；聊天界面点击对应状态按钮。\n访客和爆炸等环境设置另行管理。"
      - "旧小镇如何开始使用\n如果小镇首页还有“启用全镇默认权限（一次性）”，需要镇长进行一次性升级。\n升级会清空原来各属地的组权限设置，全部改为继承，不能撤回。先和成员商量，再确认升级，并设置好各组的小镇模板。"
  trust:
    title: "让镇外朋友来帮忙"
    summary: "不用加入小镇，也能给朋友需要的权限。"
    sections:
      - "什么时候用信任\n朋友只是来帮你盖房或取东西，不想加入小镇，可以给他“信任”。\n小镇信任适用于全镇，属地信任只适用于一块地。当前信任功能：{trust_enabled}。\n已经是小镇成员的玩家，请通过成员权限组安排权限。"
      - "四个开关分别管什么\n四项可以独立开关。\n建造：放置方块、播种、放置载具等。\n破坏：拆方块、收获、破坏载具等。\n机关与容器：开门、按按钮、打开箱子等。\n物品使用：合成、交易、喂养、拾取和丢弃等。"
      - "例子：朋友来取材料\n只想让朋友使用仓库时，打开“仓库属地 → 属地信任”，添加朋友，开启“机关与容器”。\n这也会允许他开门、按按钮等交互行为。建造和破坏可以保持关闭，不额外给他改动建筑的权限。"
      - "关闭后为什么还能操作\n信任的关闭，表示不通过信任额外给权限。\n例如访客本来就能开门，关掉某人的“机关与容器”信任，他仍能开门。想限制所有路人，需要到属地的访客权限中设置。"
      - "同一个人在两处都设了信任\n给朋友设置了属地信任后，在这块地只使用这份设置，不再叠加小镇信任。\n例如小镇信任允许建造，但仓库的属地信任只开“机关与容器”，他在仓库就不会通过信任获得建造权限。"
      - "怎样重新跟随小镇信任\n删除这个人在该属地的信任设置，才会重新使用小镇信任。\n只把四个开关全部关闭，仍然是在使用这块属地的单独设置。"
  land:
    title: "管理小镇属地"
    summary: "圈选新地、贡献旧地，以及费用与删除。"
    sections:
      - "怎样圈选新属地\n镇长或副镇长手持 {tool}，左键点一个方块、右键点另一个方块，选出同一世界里的两个对角。\n然后打开“小镇 → 创建小镇属地”，查看范围和费用，再确认。新建属地功能：{remote_enabled}。"
      - "多大、在哪里能创建\n每条水平边最长 {max_xz} 格。最小长、宽为 {min_x}、{min_z} 格，最小高度为 {min_height} 格。\n允许的 Y 范围为 {min_y} 到 {max_y}，最大高度为 {max_height}，也不能超出世界高度。\n不能与已有领地重叠；部分世界可能不允许创建。"
      - "创建和扩地怎么收费\n阶梯计费：{pricing_enabled}。只按长 × 宽算面积，高度不影响价格。\n前 250000 平方格免费；之后到 1000000、2250000、4000000 平方格，各段单价为 {price_1}、{price_2}、{price_3} 金币／平方格。\n新建和扩地费用由小镇金库支付，确认前会显示报价。"
      - "例子：从免费范围扩到一平方公里\n500 × 500 格是 250000 平方格；1000 × 1000 格是一平方公里。\n启用阶梯计费时，后者超出免费范围 750000 平方格，这部分按每平方格 {price_1} 金币计算。\n继续扩大时，已有面积不会全部改按更贵的一档收费。"
      - "缩地会退钱吗\n缩地只对有付费记录的部分按 {refund_rate} 退款，原本免费的面积不退钱。\n只改变高度，不会增加面积费用或产生面积退款。旧领地即使超出现在的高度限制，只要 Y 范围不变，也可以保留原高度调整长宽。"
      - "把个人领地贡献给小镇\n在“小镇 → 挂靠领地”选择旧个人领地，或使用 /town attach <领地名>。挂靠后成为小镇属地，原主人显示为贡献者。\n退出小镇不会自动取回这块地。镇长可用 /town release <领地名> 归还符合条件的贡献领地，并按提示确认；建镇属地不能这样归还。"
      - "删除一块地和解散小镇\n镇长或副镇长可在属地管理中删除单块属地，需要再次确认；不退款，建筑、箱内物品、下级领地和小镇保留。\n解散整个小镇只限镇长或服务器管理员。当前解散结果：{disband_policy}\n操作前请看清确认提示中的领地范围。"
  levels:
    title: "一起升级小镇"
    summary: "全镇一起交材料，解锁更多属地名额。"
    sections:
      - "升级有什么用\n等级越高，可以拥有的属地越多。1 级全镇上限为 {base_limit}，单世界上限为 {base_world_limit}；有上限时，每升一级增加 {per_level} 个名额。\n建镇属地和贡献领地也占名额，已经存在的属地不会因为超限被删除。"
      - "怎样参加共同任务\n打开“小镇 → 小镇等级”，查看下一等级需要的物品，把材料放进背包后点击提交。\n提交的物品会被消耗，进度由全镇共享，在互通子服也能累计。材料交齐后小镇升级。"
      - "例子：几个人一起完成\n假设任务需要 9 个下界合金锭，你交 4 个，朋友再交 5 个，就能一起完成。\n不要求一个人一次交齐。提交前先看任务页面显示的材料和剩余数量。"
      - "目前可以升到哪一级\n共同任务目前开放到 {open_level} 级。达到后可以继续游玩，等待后续任务开放。\n当前升级材料：\n{tasks}"
  faq:
    title: "遇到问题怎么办"
    summary: "找不到权限、模板没变化、跨服使用。"
    sections:
      - "为什么我不能放方块\n先确认你在小镇的哪块属地，再请镇长查看你所属的权限组。\n如果使用模板，检查模板的“放置方块”，以及这块地有没有单独禁止。\n如果你没加入小镇，请镇长查看访客权限或给你合适的信任。"
      - "为什么改了模板没变化\n确认改的是这个玩家所属组的模板，再看目标属地这项权限是否为“继承”。\n如果显示单独允许或单独禁止，就先决定是否恢复继承。旧模式小镇则需要镇长先启用全镇默认权限（一次性）。"
      - "镇长能用，成员不能用\n镇长、属地管理者和服务器管理员可能有直接管理权限，不能仅靠他们能否操作来判断普通成员的设置。\n例如测试建筑组是否能开箱，应请建筑组里的普通成员实际试一次。"
      - "不在同一个子服怎么办\n先看属地上显示的区服和世界。邀请可以在互通子服接受；跨服传送需服务器支持，可从属地列表点击传送。\n创建和调整范围要去对应的世界操作。其他子服的权限变化可能稍后生效；如果仍不能操作，联系镇长并说明地点和提示。"
