  usage: "&b/town help [章节] [页码] &7- 阅读游戏内小镇手册\n&b/town create <名称> &7- 创建小镇（现有领地保持个人状态；无领地时获得建镇属地，费用以创建提示为准）\n&b/town invite <玩家> &7- 邀请玩家（镇长/副镇长）\n&b/town join <小镇> [confirm] &7- 加入被邀请的小镇\n&b/town rename <新名称> &7- 修改本镇名称（仅镇长）\n&b/town leave &7- 离开小镇（领地留在小镇）\n&b/town attach [领地|all] &7- 挂靠个人领地（无参数时打开选择界面）\n&b/town group <create|rename|delete|list|info|add|remove> ... &7- 管理成员权限组\n&b/town kick <玩家> &7- 踢出成员（镇长/副镇长）\n&b/town transfer <玩家> &7- 转让镇长\n&b/town promote|demote <玩家> &7- 任命副镇长/设为普通成员（仅镇长）\n&b/town disband [confirm] &7- 解散小镇（小镇属地一并解散）\n&b/town deposit <金额> &7- 向小镇金库存款\n&b/town withdraw <金额> &7- 从小镇金库取款（镇长/副镇长）\n&b/town outpost create <名称> &7- 新建小镇属地（需要先选点）\n&b/town admin <小镇属地> [玩家] &7- 设置/清除属地管理员\n&b/town upgrade [confirm] &7- 启用全镇默认权限（一次性，仅镇长）\n&b/town release <领地> [confirm] &7- 镇长归还贡献领地（OP 可仲裁）\n&b/town level [submit] &7- 查看共同等级任务或提交背包物品\n&b/town level set <小镇> <等级> &7- 设置小镇等级（仅 OP）\n&b/town trust <玩家> <town|outpost <名称>> <build> <destroy> <switch> <item_use>\n&b/town untrust <玩家> [town|outpost <名称>]\n&b/town info [小镇] &7- 小镇信息\n&b/town list &7- 小镇列表"
